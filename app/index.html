<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080F1B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORJA">
<meta name="format-detection" content="telephone=no">
<title>FORJA · Luis</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-disciplina" viewBox="0 0 24 24"><path d="M12 3c.6 3.2 5.5 5.6 5.5 10.6A5.5 5.5 0 0 1 6.5 13.6c0-2.3 1.2-3.9 2.4-5 .3 1.6 1.2 2.7 2.4 3 0-3.1-.3-5.4.7-8.6z"/></symbol>
  <symbol id="i-cuerpo" viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></symbol>
  <symbol id="i-ajustes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5"/></symbol>
  <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z"/></symbol>
  <symbol id="i-finanzas" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M7 15h4"/></symbol>
  <symbol id="i-proyectos" viewBox="0 0 24 24"><path d="M4 20V9l4-3 4 3 4-3 4 3v11"/><path d="M4 20h16M10 20v-5h4v5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menos" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-flecha" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
</svg>

<div id="app" class="app">
  <header class="barra" id="barra">
    <div class="marca"><span class="marca-f">FORJA</span><span class="marca-ii" aria-hidden="true"></span></div>
    <div class="ambitos" role="group" aria-label="Ámbito">
      <button type="button" data-a="ambito" data-ambito="personal">Personal</button>
      <button type="button" data-a="ambito" data-ambito="proyectos">Proyectos</button>
    </div>
    <button class="estado" id="estado" data-a="sincronizar" type="button" aria-live="polite"></button>
    <button class="icono-btn" data-a="ajustes" type="button" aria-label="Ajustes"><svg class="ico"><use href="#i-ajustes"/></svg></button>
  </header>

  <main id="vista" class="vista" tabindex="-1"></main>

  <nav class="tabs" id="tabs" aria-label="Secciones">
    <button type="button" data-a="tab" data-tab="inicio"><span class="tab-ico"><svg class="ico"><use href="#i-inicio"/></svg><i class="badge" data-badge="inicio"></i></span><span>Inicio</span></button>
    <button type="button" data-a="tab" data-tab="finanzas"><span class="tab-ico"><svg class="ico"><use href="#i-finanzas"/></svg></span><span>Finanzas</span></button>
    <button type="button" data-a="tab" data-tab="proyectos"><span class="tab-ico"><svg class="ico"><use href="#i-proyectos"/></svg></span><span>Proyectos</span></button>
    <button type="button" data-a="tab" data-tab="disciplina"><span class="tab-ico"><svg class="ico"><use href="#i-disciplina"/></svg><i class="badge" data-badge="disciplina"></i></span><span>Disciplina</span></button>
    <button type="button" data-a="tab" data-tab="cuerpo"><span class="tab-ico"><svg class="ico"><use href="#i-cuerpo"/></svg></span><span>Cuerpo</span></button>
  </nav>
  <button type="button" class="fab" id="fab" data-a="registrar" aria-label="Registrar"><svg class="ico"><use href="#i-mas"/></svg></button>
</div>

<div class="velo" id="velo" data-a="cerrar-hoja" hidden></div>
<section class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden></section>
<div class="aviso" id="aviso" role="status" hidden></div>

<section class="candado" id="candado" hidden aria-label="Candado de FORJA"></section>

<script src="/fin-calc.js" defer></script>
<script src="/app.js" defer></script>
<script src="/finanzas.js" defer></script>
</body>
</html>
